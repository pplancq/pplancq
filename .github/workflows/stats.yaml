name: Update README cards

on:
  schedule:
    - cron: 0 0 * * * # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=material-palenight&show_icons=true&hide_title=true&show=reviews
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card dev-tools
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=dev-tools&theme=material-palenight
          path: profile/dev-tools.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card svg-tools
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=svg-tools&theme=material-palenight
          path: profile/svg-tools.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card shelter-ui
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=shelter-ui&theme=material-palenight
          path: profile/shelter-ui.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check gist token validity
        id: gist_token
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GIST_TOKEN" \
            "https://api.github.com/gists?per_page=1")
          if [ "$status" = "200" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GIST_TOKEN is invalid or expired (HTTP $status)"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue for invalid gist token
        if: steps.gist_token.outputs.valid != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔑 GIST_TOKEN has expired"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$title" \
              --assignee "${{ github.repository_owner }}" \
              --body "The \`GIST_TOKEN\` secret is missing, invalid or has expired and needs to be updated. The gist cards were not regenerated.

          **Action required:**
          1. Generate a new Personal Access Token (classic) with the \`gist\` scope
          2. Update the \`GIST_TOKEN\` secret in repository settings
          3. Close this issue once completed

          **Failed workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Generate gist card useSyncExternalStore
        if: steps.gist_token.outputs.valid == 'true'
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: gist
          options: username=${{ github.repository_owner }}&id=5c4c50e03aa76dfe3502e24263522278&theme=material-palenight
          path: profile/useSyncExternalStore.svg
          token: ${{ secrets.GIST_TOKEN }}

      - name: Generate gist card withMemo
        if: steps.gist_token.outputs.valid == 'true'
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: gist
          options: username=${{ github.repository_owner }}&id=53c55e861a4d35ddbd761bbb2b4e73cf&theme=material-palenight
          path: profile/withMemo.svg
          token: ${{ secrets.GIST_TOKEN }}

      - name: Generate gist card useHandler
        if: steps.gist_token.outputs.valid == 'true'
        uses: readme-tools/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: gist
          options: username=${{ github.repository_owner }}&id=590295a46ce8bca1bff85f0915f0e761&theme=material-palenight
          path: profile/useHandler.svg
          token: ${{ secrets.GIST_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards svg" || exit 0
          git push
